name: Trigger-All-Workflows

on:
  workflow_dispatch:
    inputs:
      ipq60xx_libwrt:
        description: 运行 IPQ60XX-LibWrt
        required: false
        type: boolean
        default: true
      ipq807x_libwrt:
        description: 运行 IPQ807X-LibWrt（本机用不到，默认关闭）
        required: false
        type: boolean
        default: false
      jdcloud_immortalwrt:
        description: 运行 JDCloud-ImmortalWrt
        required: false
        type: boolean
        default: true
      jdcloud_nowifi_immortalwrt:
        description: 运行 JDCloud-NoWiFi-ImmortalWrt
        required: false
        type: boolean
        default: true
      x86_64_immortalwrt:
        description: 运行 x86-64-ImmortalWrt
        required: false
        type: boolean
        default: true
      build_packages:
        description: 运行 Build-Packages
        required: false
        type: boolean
        default: true
  # 定时已移除（2026-11-07）：schedule 触发会绕过 inputs 一次并发拉起 5 个 build——
  # 2026-11-06 首触发一夜造出 16 条分组缓存 + 2.3GB 外源 coretree，撑爆 10GB Actions
  # 缓存上限，把 IPQ60XX 热缓存逐出，导致 run #14 冷下载 117 分钟后 runner 暴毙。
  # 想一键全跑请手动 workflow_dispatch，不再让它自动周五撞车。

permissions:
  contents: read
  actions: read

concurrency:
  group: trigger-all-workflows-${{ github.repository }}
  cancel-in-progress: false

jobs:

    IPQ60XX-LibWrt:
      if: ${{ github.event_name == 'schedule' || inputs.ipq60xx_libwrt }}
      uses: ./.github/workflows/IPQ60XX-LibWrt.yml
      permissions:
        contents: write
        actions: write
      secrets: inherit

    # IPQ807X 与本机（京东云雅典娜 / IPQ60XX）无关，已停掉以节省 Actions 时间。
    # 恢复方法：取消注释本 job 的 6 行，并把上面 inputs.ipq807x_libwrt 的 default 改回 true。
    # IPQ807X-LibWrt:
    #   if: ${{ github.event_name == 'schedule' || inputs.ipq807x_libwrt }}
    #   uses: ./.github/workflows/IPQ807X-LibWrt.yml
    #   permissions:
    #     contents: write
    #     actions: write

    JDCloud-ImmortalWrt:
      if: ${{ github.event_name == 'schedule' || inputs.jdcloud_immortalwrt }}
      uses: ./.github/workflows/JDCloud-ImmortalWrt.yml
      permissions:
        contents: write
        actions: write
      secrets: inherit

    JDCloud-NoWiFi-ImmortalWrt:
      if: ${{ github.event_name == 'schedule' || inputs.jdcloud_nowifi_immortalwrt }}
      uses: ./.github/workflows/JDCloud-NoWiFi-ImmortalWrt.yml
      permissions:
        contents: write
        actions: write
      secrets: inherit

    x86-64-ImmortalWrt:
      if: ${{ github.event_name == 'schedule' || inputs.x86_64_immortalwrt }}
      uses: ./.github/workflows/x86-64-ImmortalWrt.yml
      permissions:
        contents: write
        actions: write
      secrets: inherit

    Build-Packages:
      if: ${{ github.event_name == 'schedule' || inputs.build_packages }}
      uses: ./.github/workflows/Build-Packages.yml
      permissions:
        contents: write
        actions: read
      secrets: inherit
      with:
        # 每周只编雅典娜对应的 25.12 系列：4 个 SDK 全跑等于 8 个 job 每个都要编
        # node / python3 / mariadb，Actions 时间翻倍且老 SDK 里 node 更容易失败。
        # 需要 23.05 / 24.10 / main 时手动运行 Build-Packages 选对应版本即可。
        sdk_version: '25.12'
