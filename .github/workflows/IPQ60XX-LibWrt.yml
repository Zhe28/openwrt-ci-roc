name: IPQ60XX-LibWrt
# 新仓首次索引占位注释（无功能影响）

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "30 7 * * 6"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    secrets: inherit
    with:
      repo_url: https://github.com/laipeng668/openwrt-6.x.git
      repo_branch: 25.12-nss
      config_file: configs/IPQ60XX.config
      firmware_tag: IPQ60XX
      kernel_file: kernel-6.12
      artifact_prefix: IPQ60XX
      manifest_file: libwrt-qualcommax-ipq60xx.manifest
      release_summary: >-
        这是开启全功能NSS的6.12内核固件，默认主题为Aurora；该固件在ImmortalWrt的基础上，添加了额外的软件包cpufreq、ddns、upnp、wol、samba4、vlmcsd、autoreboot、uhttpd、homeproxy(sing-box透明代理)、watchcat、3cat，内置redis、PostgreSQL(含pgvector向量扩展)、MariaDB(原生向量支持)、Node.js、Python3，并添加了若干工具，具体详见IPQ60XX.config和General.config。
