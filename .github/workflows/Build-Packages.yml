name: Build-Packages

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: 可选：OpenWrt SDK 版本，ALL 表示全部版本，main 使用主线 snapshots，稳定版自动使用对应系列最新版本。
        required: false
        default: '25.12'
        type: choice
        options:
          - ALL
          - main
          - '25.12'
          - '24.10'
          - '23.05'
      arch:
        description: 可选：要编译的架构，ALL 表示全部。
        required: false
        default: ALL
        type: choice
        options:
          - ALL
          - x86-64
          - aarch64
      package:
        description: 可选：要编译的软件包，ALL 表示全部。
        required: false
        default: ALL
        type: choice
        options:
          - ALL
          - nginx
          - redis
          - pgsql
          - mariadb
          - node
          - bun
          - python3
          - luci-app-aria2
          - luci-app-frpc
          - luci-app-frps
          - luci-app-gecoosac
          - luci-app-lucky
          - luci-app-openlist2
          - luci-theme-argon
          - luci-theme-aurora
  workflow_call:
    inputs:
      sdk_version:
        required: false
        default: ALL
        type: string
      arch:
        required: false
        default: ALL
        type: string
      package:
        required: false
        default: ALL
        type: string

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  TZ: Asia/Shanghai
  OUTPUT_DIR: ${{ github.workspace }}/artifacts/packages

jobs:
  Prepare:
    name: Prepare Matrix(准备编译矩阵)
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - name: Generate Build Matrix(生成编译矩阵)
      id: matrix
      env:
        SELECTED_ARCH: ${{ inputs.arch }}
        SELECTED_PACKAGE: ${{ inputs.package }}
        SELECTED_SDK_VERSION: ${{ inputs.sdk_version }}
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        import os

        selected_arch = os.environ["SELECTED_ARCH"]
        selected_package = os.environ["SELECTED_PACKAGE"].lower()
        selected_sdk_version = os.environ["SELECTED_SDK_VERSION"]

        sdk_versions = ["main", "25.12", "24.10", "23.05"]
        architectures = ["x86-64", "aarch64"]

        if selected_sdk_version == "ALL":
            selected_sdk_versions = sdk_versions
        elif selected_sdk_version in sdk_versions:
            selected_sdk_versions = [selected_sdk_version]
        else:
            raise SystemExit(f"Unsupported sdk_version: {selected_sdk_version}")

        if selected_arch == "ALL" and selected_package in {"luci-theme-argon", "luci-theme-aurora"}:
            selected_architectures = ["x86-64"]
        elif selected_arch == "ALL":
            selected_architectures = architectures
        elif selected_arch in architectures:
            selected_architectures = [selected_arch]
        else:
            raise SystemExit(f"Unsupported arch: {selected_arch}")

        def build_for(sdk_version, architecture, package_split, package_selection):
            if architecture == "x86-64":
                entry = {
                    "sdk_version": sdk_version,
                    "name": "x86-64",
                    "openwrt_target": "x86",
                    "openwrt_subtarget": "64",
                    "openwrt_target_profile": "",
                    "config_files": "configs/x86-64.config configs/Packages.config",
                }
            elif sdk_version in {"23.05", "24.10"}:
                entry = {
                    "sdk_version": sdk_version,
                    "name": "aarch64",
                    "openwrt_target": "mediatek",
                    "openwrt_subtarget": "filogic",
                    "openwrt_target_profile": "rax3000m",
                    "config_files": "configs/Packages.config",
                }
            else:
                entry = {
                    "sdk_version": sdk_version,
                    "name": "aarch64",
                    "openwrt_target": "qualcommax",
                    "openwrt_subtarget": "ipq60xx",
                    "openwrt_target_profile": "",
                    "config_files": "configs/JDCloud.config configs/Packages.config",
                }

            entry["package_split"] = package_split
            entry["package_selection"] = package_selection
            return entry

        # node 单独一个包就要 190~210 分钟（SDK 得先编 python3/host 与 python-setuptools/host 才能编 V8），
        # 和其它包挤在同一个 job 里很容易顶破 timeout-minutes: 360（GitHub Actions 单 job 硬上限）。
        # 因此 package=ALL 时把 node 拆成独立的 matrix 格子。
        # 不能改成“调用两次 Build-Packages”：Release 用的是 ncipollo/release-action 且
        # replacesArtifacts: true，两条并行 run 会互相删掉对方刚上传的产物。
        NON_NODE_PACKAGES = ",".join([
            "nginx",
            "redis",
            "pgsql",
            "mariadb",
            "bun",
            "python3",
            "luci-app-aria2",
            "luci-app-frpc",
            "luci-app-frps",
            "luci-app-gecoosac",
            "luci-app-lucky",
            "luci-app-openlist2",
            "luci-theme-argon",
            "luci-theme-aurora",
        ])

        def package_splits(package):
            if package == "all":
                return (
                    ("packages", NON_NODE_PACKAGES),
                    ("node", "node"),
                )
            # 逗号列表只用于给脚本选择范围，分组名里的逗号换成 + 以免污染 artifact 名称
            return ((package.replace(",", "+"), package),)

        include = [
            build_for(sdk_version, architecture, split, package_selection)
            for sdk_version in selected_sdk_versions
            for architecture in selected_architectures
            for split, package_selection in package_splits(selected_package)
        ]

        print(f"matrix={json.dumps({'include': include}, separators=(',', ':'))}")
        PY

  Build:
    name: Build (${{ matrix.sdk_version }} / ${{ matrix.name }} / ${{ matrix.package_split }})
    runs-on: ubuntu-24.04
    needs: Prepare
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Prepare.outputs.matrix) }}
    steps:
    - name: Check Server Performance(检查服务器性能)
      run: |
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(grep "physical id" /proc/cpuinfo | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(grep name /proc/cpuinfo | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        free -h
        echo "--------------------------硬盘信息--------------------------"
        df -hT

    - name: Initialization Environment(初始化环境)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        sudo -E apt-get -y install \
          build-essential \
          clang \
          curl \
          file \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          gettext \
          gnupg \
          git \
          libelf-dev \
          libfuse-dev \
          libncurses-dev \
          libssl-dev \
          python3 \
          python3-setuptools \
          rsync \
          tar \
          unzip \
          wget \
          xz-utils \
          zip \
          zlib1g-dev \
          zstd
        sudo timedatectl set-timezone "$TZ"

    - name: Checkout(检出代码)
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Resolve And Verify SDK Metadata(解析并验证SDK元数据)
      id: sdk
      env:
        OPENWRT_TARGET: ${{ matrix.openwrt_target }}
        OPENWRT_SUBTARGET: ${{ matrix.openwrt_subtarget }}
        OPENWRT_SDK_VERSION: ${{ matrix.sdk_version }}
        SDK_CACHE_DIR: ${{ runner.temp }}/openwrt-sdk-cache
        SDK_METADATA_REFRESH: ${{ matrix.sdk_version == 'main' && 'true' || 'false' }}
        SDK_METADATA_ONLY: '1'
      run: |
        chmod +x scripts/SDK-script.sh
        scripts/SDK-script.sh

    - name: Build Packages With OpenWrt SDK(使用OpenWrt SDK编译软件包)
      env:
        OPENWRT_TARGET: ${{ matrix.openwrt_target }}
        OPENWRT_SUBTARGET: ${{ matrix.openwrt_subtarget }}
        OPENWRT_TARGET_PROFILE: ${{ matrix.openwrt_target_profile }}
        PACKAGE_CONFIG_FILES: ${{ matrix.config_files }}
        PACKAGE_ARCH_NAME: ${{ matrix.name }}
        PACKAGE_SELECTED_ARCH: ${{ inputs.arch }}
        PACKAGE_SELECTION: ${{ matrix.package_selection }}
        OPENWRT_SDK_VERSION: ${{ matrix.sdk_version }}
        SDK_CACHE_DIR: ${{ runner.temp }}/openwrt-sdk-cache
        SDK_METADATA_REFRESH: ${{ matrix.sdk_version == 'main' && 'true' || 'false' }}
        SDK_ROOT: ${{ runner.temp }}/openwrt-sdk
        SDK_SHA256: ${{ steps.sdk.outputs.sha256 }}
        SDK_URL: ${{ steps.sdk.outputs.url }}
      run: |
        chmod +x scripts/SDK-script.sh
        scripts/SDK-script.sh

    - name: Upload Packages Artifact(上传软件包产物)
      if: ${{ always() && !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.sdk_version }}-Packages-${{ matrix.name }}-${{ matrix.package_split }}
        path: artifacts/packages/*
        if-no-files-found: error
        compression-level: 0
        retention-days: 7

  Release:
    runs-on: ubuntu-24.04
    needs: Build
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: write
      actions: read

    steps:
    - name: Download Packages Artifacts(下载软件包产物)
      uses: actions/download-artifact@v4
      with:
        pattern: ${{ inputs.sdk_version == 'ALL' && '*-Packages-*' || format('{0}-Packages-*', inputs.sdk_version) }}
        path: artifacts/release
        merge-multiple: true

    - name: Check Downloaded Packages(检查已下载的软件包)
      id: packages
      run: |
        mkdir -p artifacts/release
        if find artifacts/release -type f -name '*.zip' -print -quit | grep -q .; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "::warning::没有可发布的成功编译产物，跳过 Release 上传。"
        fi

    - name: Upload Packages To Release(发布软件包)
      if: ${{ steps.packages.outputs.found == 'true' }}
      uses: ncipollo/release-action@v1
      with:
        name: Packages
        allowUpdates: true
        replacesArtifacts: true
        artifactErrorsFailBuild: true
        tag: Packages
        token: ${{ github.token }}
        artifacts: artifacts/release/*
        body: |
          **OpenWrt 软件包**
          - SDK 来源：${{ inputs.sdk_version }}（ALL 同时编译 main/25.12/24.10/23.05，main 使用 OpenWrt snapshots，23.05/24.10/25.12 自动使用对应系列最新稳定版本）
          - x86-64 配置文件：x86/64，configs/x86-64.config + configs/Packages.config
          - aarch64 配置文件：main/25.12 使用 qualcommax/ipq60xx，configs/JDCloud.config + configs/Packages.config；23.05/24.10 使用 mediatek/filogic，SDK脚本内置rax3000m配置 + configs/Packages.config
          - 选择的架构：${{ inputs.arch }}
          - 选择的 SDK：${{ inputs.sdk_version }}
          - 选择的软件包：${{ inputs.package }}
          - 源码来源：[laipeng668/packages](https://github.com/laipeng668/packages)（aria2、ariang、frp-binary、nginx分支）、[laipeng668/luci](https://github.com/laipeng668/luci)（frp分支）、[laipeng668/luci-app-gecoosac](https://github.com/laipeng668/luci-app-gecoosac)、[gdy666/luci-app-lucky](https://github.com/gdy666/luci-app-lucky)、[laipeng668/luci-app-openlist2](https://github.com/laipeng668/luci-app-openlist2)、[jerrykuku/luci-theme-argon](https://github.com/jerrykuku/luci-theme-argon)、[jerrykuku/luci-app-argon-config](https://github.com/jerrykuku/luci-app-argon-config)、[eamonxg/luci-theme-aurora](https://github.com/eamonxg/luci-theme-aurora)、[eamonxg/luci-app-aurora-config](https://github.com/eamonxg/luci-app-aurora-config)
          - 数据库与运行时包（redis、pgsql、mariadb、python3）直接编译自 SDK 自带的官方 packages feed，本仓库不 fork、不覆盖版本；`mysql` 由 `mariadb-server`（`PROVIDES:=mysql-server`）提供。运行时 `node` 与 `bun` 是预编译二进制 wrapper（scripts/packages/node 取 unofficial-builds musl 二进制、产物名带 ABI 后缀 `node127`；scripts/packages/bun 取 Bun 官方 npm musl 二进制包、版本钉 1.4.4），CI 内解包即完成、不编译。这些包的 libc/libopenssl 等基础依赖仍需从软件源补齐。
          - 说明：Release 附件按 `<SDK>-<软件包>-<架构>.zip` 分组，普通分组内的 `.apk/.ipk` 文件也使用对应架构后缀；`luci-theme-argon` 和 `luci-theme-aurora` 使用 `all` 架构后缀，`arch=ALL` 时各自只保留一份。下载后先解压，`apk` 软件包使用 `apk add --allow-untrusted *.apk` 安装，`ipk` 软件包使用 `opkg install *.ipk` 安装。
          - 分组编译：`package=ALL` 时矩阵会拆成 `packages`（nginx、redis、pgsql、mariadb、bun、python3 与全部 LuCI 包）和 `node` 两组分别编译。实测 `node` 单独一组约 190~210 分钟，其余包约 150 分钟；旧的不拆分矩阵在 25.12 x86-64 上跑满 360 分钟超时被取消，只有 aarch64 以 352 分钟勉强完成。
