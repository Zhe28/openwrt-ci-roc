name: Build-OpenWrt

on:
  workflow_call:
    inputs:
      repo_url:
        required: true
        type: string
      repo_branch:
        required: true
        type: string
      config_file:
        required: true
        type: string
      firmware_tag:
        required: true
        type: string
      kernel_file:
        required: true
        type: string
      artifact_prefix:
        required: true
        type: string
      manifest_file:
        required: true
        type: string
      release_summary:
        required: true
        type: string
      remove_sqm_scripts_nss:
        required: false
        type: boolean
        default: false
      rename_qualcommax_to_nowifi:
        required: false
        type: boolean
        default: false
      delete_old_workflows:
        required: false
        type: boolean
        default: false
      package_extension:
        required: false
        type: string
        default: apk

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  GENERAL_CONFIG_FILE: configs/General.config
  DIY_SCRIPT: scripts/Roc-script.sh
  OPENWRT_PATH: /mnt/openwrt
  TZ: Asia/Shanghai

jobs:
  # ── 阶段 1：准备核心 ────────────────────────────────────────────────
  # 克隆源码、自定义脚本、下载源码包，只编译 host tools + 交叉 toolchain + 内核，
  # 然后上传三份缓存：staging（工具链安装产物）、core-tree（build_dir+dl）、ccache-core。
  Prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    concurrency:
      group: openwrt-prepare-${{ inputs.artifact_prefix }}-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      artifact_name: ${{ steps.variables.outputs.artifact_name }}
      ccache_key: ${{ steps.variables.outputs.ccache_key }}
      staging_key: ${{ steps.variables.outputs.staging_key }}
      coretree_key: ${{ steps.variables.outputs.coretree_key }}
      ccache_group_base: ${{ steps.variables.outputs.ccache_group_base }}
      version_info: ${{ steps.source.outputs.version_info }}
      version_kernel: ${{ steps.source.outputs.version_kernel }}

    steps:
    - name: Initialization Environment(初始化环境)
      env:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_SUSPEND: 1
      run: |
        for attempt in 1 2 3; do
          if timeout -k 60 900 sudo -E apt-get -y update; then break; fi
          if [ "$attempt" -eq 3 ]; then echo "Error: apt-get update failed after 3 attempts" >&2; exit 1; fi
          echo "::warning::apt-get update failed (attempt $attempt/3); retrying."
          sleep $((attempt * 5))
        done
        for attempt in 1 2 3; do
          # asciidoc(texlive 全家桶数百MB)、antlr3(openjdk 数百MB)、uglifyjs(nodejs)
          # 是 apt 断流重排的最大拖累（run 42247191534 即死在这三条链上），仓库无脚本引用，删除。
          if timeout -k 60 1800 sudo -E apt-get -y install ack autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool jq libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libfuse-dev libssl-dev libtool lrzsz \
            genisoimage msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev qemu-utils \
            rsync scons squashfs-tools subversion swig texinfo upx-ucl unzip vim wget xmlto xxd zlib1g-dev; then break; fi
          if [ "$attempt" -eq 3 ]; then echo "Error: apt-get install failed after 3 attempts" >&2; exit 1; fi
          echo "::warning::apt-get install failed (attempt $attempt/3); fixing and retrying."
          sudo -E apt-get -y -f install || true
          sleep $((attempt * 5))
        done
        timeout -k 10 120 sudo -E systemctl daemon-reload || echo "::warning::daemon-reload timed out; continuing."
        timeout -k 10 120 sudo timedatectl set-timezone "$TZ" || echo "::warning::set-timezone timed out; continuing."

    - name: Checkout(检出代码)
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Clone Source Code(克隆源代码)
      id: source
      env:
        REPO_URL: ${{ inputs.repo_url }}
        REPO_BRANCH: ${{ inputs.repo_branch }}
        KERNEL_FILE: ${{ inputs.kernel_file }}
      run: |
        df -hT "$GITHUB_WORKSPACE"
        sudo mkdir -p "$OPENWRT_PATH"
        sudo chown -R "$(id -u):$(id -g)" "$OPENWRT_PATH"
        for attempt in 1 2 3; do
          if git clone --depth 1 -b "$REPO_BRANCH" --single-branch "$REPO_URL" "$OPENWRT_PATH"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "Error: source clone failed after $attempt attempts" >&2
            exit 1
          fi
          echo "::warning::Source clone failed (attempt $attempt/3); retrying."
          sudo rm -rf "$OPENWRT_PATH"
          sudo mkdir -p "$OPENWRT_PATH"
          sudo chown -R "$(id -u):$(id -g)" "$OPENWRT_PATH"
          sleep $((attempt * 5))
        done
        cd "$OPENWRT_PATH"
        VERSION_INFO="$(git show -s --date=short --format="作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %H")"
        {
          echo "version_info<<EOF"
          echo "$VERSION_INFO"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        VERSION_KERNEL="$(grep -oP 'LINUX_KERNEL_HASH-\K[0-9]+\.[0-9]+\.[0-9]+' "target/linux/generic/$KERNEL_FILE" | head -n 1 || true)"
        echo "version_kernel=${VERSION_KERNEL:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Disable Mainland Mirrors(屏蔽大陆下载源)
      run: |
        cd "$OPENWRT_PATH"
        mirror_file="scripts/projectsmirrors.json"
        jq '
          with_entries(
            .value |= map(select(
              test("^https?://(mirrors\\.tencent\\.com|mirrors\\.aliyun\\.com|mirrors\\.tuna\\.tsinghua\\.edu\\.cn|mirrors\\.ustc\\.edu\\.cn|mirror\\.iscas\\.ac\\.cn|mirror\\.nju\\.edu\\.cn)(/|$)")
              | not
            ))
          )
        ' "$mirror_file" > "$mirror_file.tmp"
        mv "$mirror_file.tmp" "$mirror_file"
        sed -i '/raw\.gitmirror\.com/d' scripts/download.pl

    - name: Generate Variables(生成变量)
      id: variables
      env:
        ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
        CUSTOMIZATION_HASH: ${{ hashFiles('scripts/Roc-script.sh', 'configs/General.config', inputs.config_file) }}
        REPO_URL: ${{ inputs.repo_url }}
        REPO_BRANCH: ${{ inputs.repo_branch }}
        CONFIG_FILE: ${{ inputs.config_file }}
      run: |
        cp "$GITHUB_WORKSPACE/$CONFIG_FILE" "$OPENWRT_PATH/.config"
        cd "$OPENWRT_PATH"
        make defconfig > /dev/null 2>&1
        SOURCE_REPO="${REPO_URL##*/}"
        SOURCE_REPO="${SOURCE_REPO%.git}"
        DEVICE_TARGET="$(awk -F '"' '/CONFIG_TARGET_BOARD/ {print $2; exit}' .config)"
        DEVICE_SUBTARGET="$(awk -F '"' '/CONFIG_TARGET_SUBTARGET/ {print $2; exit}' .config)"
        HASH="$(git rev-parse HEAD)"
        CACHE_SCOPE="${CONFIG_FILE##*/}"
        CACHE_SCOPE="${CACHE_SCOPE%.config}"
        CUSTOMIZATION_HASH="${CUSTOMIZATION_HASH:0:7}"
        HASH="${HASH:0:7}"
        CACHE_PREFIX="openwrt-${RUNNER_OS}-${SOURCE_REPO}-${REPO_BRANCH}-${DEVICE_TARGET}-${DEVICE_SUBTARGET}"
        CCACHE_KEY="${CACHE_PREFIX}-ccache-${CACHE_SCOPE}-${CUSTOMIZATION_HASH}-${HASH}"
        CCACHE_RESTORE_PREFIX="${CACHE_PREFIX}-ccache-${CACHE_SCOPE}-${CUSTOMIZATION_HASH}-"
        CCACHE_SCOPE_PREFIX="${CACHE_PREFIX}-ccache-${CACHE_SCOPE}-"
        CCACHE_FALLBACK_PREFIX="${CACHE_PREFIX}-ccache-"
        CCACHE_GROUP_BASE="${CACHE_PREFIX}-ccache-${CACHE_SCOPE}-${CUSTOMIZATION_HASH}-G"
        STAGING_KEY="${CACHE_PREFIX}-staging-${CACHE_SCOPE}-${CUSTOMIZATION_HASH}-${HASH}"
        STAGING_RESTORE_PREFIX="${CACHE_PREFIX}-staging-${CACHE_SCOPE}-${CUSTOMIZATION_HASH}-"
        STAGING_SCOPE_PREFIX="${CACHE_PREFIX}-staging-${CACHE_SCOPE}-"
        STAGING_FALLBACK_PREFIX="${CACHE_PREFIX}-staging-"
        CORETREE_KEY="${CACHE_PREFIX}-coretree-${CACHE_SCOPE}-${CUSTOMIZATION_HASH}-${HASH}"
        CORETREE_RESTORE_PREFIX="${CACHE_PREFIX}-coretree-${CACHE_SCOPE}-${CUSTOMIZATION_HASH}-"
        CORETREE_SCOPE_PREFIX="${CACHE_PREFIX}-coretree-${CACHE_SCOPE}-"
        CORETREE_FALLBACK_PREFIX="${CACHE_PREFIX}-coretree-"
        ARTIFACT_NAME="firmware-${ARTIFACT_PREFIX}"
        {
          echo "CCACHE_KEY=$CCACHE_KEY"
          echo "CCACHE_RESTORE_PREFIX=$CCACHE_RESTORE_PREFIX"
          echo "CCACHE_SCOPE_PREFIX=$CCACHE_SCOPE_PREFIX"
          echo "CCACHE_FALLBACK_PREFIX=$CCACHE_FALLBACK_PREFIX"
          echo "STAGING_KEY=$STAGING_KEY"
          echo "STAGING_RESTORE_PREFIX=$STAGING_RESTORE_PREFIX"
          echo "STAGING_SCOPE_PREFIX=$STAGING_SCOPE_PREFIX"
          echo "STAGING_FALLBACK_PREFIX=$STAGING_FALLBACK_PREFIX"
          echo "CORETREE_KEY=$CORETREE_KEY"
          echo "CORETREE_RESTORE_PREFIX=$CORETREE_RESTORE_PREFIX"
          echo "CORETREE_SCOPE_PREFIX=$CORETREE_SCOPE_PREFIX"
          echo "CORETREE_FALLBACK_PREFIX=$CORETREE_FALLBACK_PREFIX"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME"
        } >> "$GITHUB_ENV"
        {
          echo "artifact_name=$ARTIFACT_NAME"
          echo "ccache_key=$CCACHE_KEY"
          echo "staging_key=$STAGING_KEY"
          echo "coretree_key=$CORETREE_KEY"
          echo "ccache_group_base=$CCACHE_GROUP_BASE"
        } >> "$GITHUB_OUTPUT"

    - name: Cache Ccache(缓存编译结果)
      uses: actions/cache@v4
      with:
        key: ${{ env.CCACHE_KEY }}
        restore-keys: |
          ${{ env.CCACHE_RESTORE_PREFIX }}
          ${{ env.CCACHE_SCOPE_PREFIX }}
          ${{ env.CCACHE_FALLBACK_PREFIX }}
        path: ${{ env.OPENWRT_PATH }}/.ccache

    - name: Cache Staging Directory(缓存工具链)
      uses: actions/cache@v4
      with:
        key: ${{ env.STAGING_KEY }}
        restore-keys: |
          ${{ env.STAGING_RESTORE_PREFIX }}
          ${{ env.STAGING_SCOPE_PREFIX }}
          ${{ env.STAGING_FALLBACK_PREFIX }}
        path: ${{ env.OPENWRT_PATH }}/staging_dir

    - name: Cache Core Tree(缓存build_dir与dl)
      uses: actions/cache@v4
      with:
        key: ${{ env.CORETREE_KEY }}
        restore-keys: |
          ${{ env.CORETREE_RESTORE_PREFIX }}
          ${{ env.CORETREE_SCOPE_PREFIX }}
          ${{ env.CORETREE_FALLBACK_PREFIX }}
        path: |
          ${{ env.OPENWRT_PATH }}/build_dir
          ${{ env.OPENWRT_PATH }}/dl

    - name: Update Feeds(更新feeds)
      run: |
        cd "$OPENWRT_PATH"
        ./scripts/feeds update -a

    - name: Load Custom Configuration(加载自定义配置)
      env:
        CONFIG_FILE: ${{ inputs.config_file }}
      run: |
        chmod +x "$GITHUB_WORKSPACE/$DIY_SCRIPT"
        cd "$OPENWRT_PATH"
        "$GITHUB_WORKSPACE/$DIY_SCRIPT" \
          "$GITHUB_WORKSPACE/$CONFIG_FILE" \
          "$GITHUB_WORKSPACE/$GENERAL_CONFIG_FILE"

    - name: Download DL Package(下载DL软件包)
      env:
        CONFIG_FILE: ${{ inputs.config_file }}
      run: |
        cat "$GITHUB_WORKSPACE/$CONFIG_FILE" "$GITHUB_WORKSPACE/$GENERAL_CONFIG_FILE" > "$OPENWRT_PATH/.config"
        cd "$OPENWRT_PATH"
        if [ "${{ inputs.remove_sqm_scripts_nss }}" = "true" ]; then
          sed -i '/CONFIG_PACKAGE_sqm-scripts-nss=y/d' .config
        fi
        make defconfig
        for attempt in 1 2 3; do
          if make download -j"$(nproc)"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "Error: make download failed after $attempt attempts" >&2
            exit 1
          fi
          echo "::warning::make download failed (attempt $attempt/3); removing incomplete files before retry."
          find dl -type f -size -1024c -print -delete
          sleep $((attempt * 5))
        done

    - name: Build Core Toolchain and Kernel(编译工具链与内核)
      run: |
        cd "$OPENWRT_PATH"
        ccache -M 2G
        make tools/compile -j"$(nproc)" || make tools/compile V=s
        make toolchain/compile -j"$(nproc)" || make toolchain/compile V=s
        make target/linux/prepare
        make target/linux/compile -j"$(nproc)" || make target/linux/compile V=s

    - name: Check Space Usage(检查空间使用情况)
      if: (!cancelled())
      run: df -hT

  # ── 阶段 2：矩阵分组并行编译包 ──────────────────────────────────────
  # 每组 = 完整配置减去其他组的"重包"符号（置 n），依赖自动解析；
  # toolchain/内核从 core-tree+staging 缓存恢复，不重复编译。
  Build-Packages:
    runs-on: ubuntu-24.04
    # node 内核身编译(含 V8)就要 190~210 分钟，旧的 180 上限必杀它；放宽到 300，
    # 慢死场景由 apt 步骤的 timeout-k(90 分钟)与 Retry-Failed 自动重试兜底。
    timeout-minutes: 300
    needs: Prepare
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        group:
          - db-pg    # pgsql(+pgvector patch)
          - db-misc  # mariadb + redis
          - node
          - python
          - net
          - apps

    steps:
    - name: Initialization Environment(初始化环境)
      env:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_SUSPEND: 1
      run: |
        for attempt in 1 2 3; do
          if timeout -k 60 900 sudo -E apt-get -y update; then break; fi
          if [ "$attempt" -eq 3 ]; then echo "Error: apt-get update failed after 3 attempts" >&2; exit 1; fi
          echo "::warning::apt-get update failed (attempt $attempt/3); retrying."
          sleep $((attempt * 5))
        done
        for attempt in 1 2 3; do
          # asciidoc(texlive 全家桶数百MB)、antlr3(openjdk 数百MB)、uglifyjs(nodejs)
          # 是 apt 断流重排的最大拖累（run 42247191534 即死在这三条链上），仓库无脚本引用，删除。
          if timeout -k 60 1800 sudo -E apt-get -y install ack autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool jq libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libfuse-dev libssl-dev libtool lrzsz \
            genisoimage msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev qemu-utils \
            rsync scons squashfs-tools subversion swig texinfo upx-ucl unzip vim wget xmlto xxd zlib1g-dev; then break; fi
          if [ "$attempt" -eq 3 ]; then echo "Error: apt-get install failed after 3 attempts" >&2; exit 1; fi
          echo "::warning::apt-get install failed (attempt $attempt/3); fixing and retrying."
          sudo -E apt-get -y -f install || true
          sleep $((attempt * 5))
        done
        timeout -k 10 120 sudo -E systemctl daemon-reload || echo "::warning::daemon-reload timed out; continuing."
        timeout -k 10 120 sudo timedatectl set-timezone "$TZ" || echo "::warning::set-timezone timed out; continuing."

    - name: Checkout(检出代码)
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Clone Source Code(克隆源代码)
      env:
        REPO_URL: ${{ inputs.repo_url }}
        REPO_BRANCH: ${{ inputs.repo_branch }}
      run: |
        sudo mkdir -p "$OPENWRT_PATH"
        sudo chown -R "$(id -u):$(id -g)" "$OPENWRT_PATH"
        for attempt in 1 2 3; do
          if git clone --depth 1 -b "$REPO_BRANCH" --single-branch "$REPO_URL" "$OPENWRT_PATH"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "Error: source clone failed after $attempt attempts" >&2
            exit 1
          fi
          echo "::warning::Source clone failed (attempt $attempt/3); retrying."
          sudo rm -rf "$OPENWRT_PATH"
          sudo mkdir -p "$OPENWRT_PATH"
          sudo chown -R "$(id -u):$(id -g)" "$OPENWRT_PATH"
          sleep $((attempt * 5))
        done

    - name: Disable Mainland Mirrors(屏蔽大陆下载源)
      run: |
        cd "$OPENWRT_PATH"
        mirror_file="scripts/projectsmirrors.json"
        jq '
          with_entries(
            .value |= map(select(
              test("^https?://(mirrors\\.tencent\\.com|mirrors\\.aliyun\\.com|mirrors\\.tuna\\.tsinghua\\.edu\\.cn|mirrors\\.ustc\\.edu\\.cn|mirror\\.iscas\\.ac\\.cn|mirror\\.nju\\.edu\\.cn)(/|$)")
              | not
            ))
          )
        ' "$mirror_file" > "$mirror_file.tmp"
        mv "$mirror_file.tmp" "$mirror_file"
        sed -i '/raw\.gitmirror\.com/d' scripts/download.pl

    - name: Compute Group Variables(计算分组变量)
      id: groupvars
      env:
        GROUP_KEY: ${{ matrix.group }}
        CCACHE_GROUP_BASE: ${{ needs.Prepare.outputs.ccache_group_base }}
      run: |
        # samba4 无独立开关，全靠 luci-app-samba4 依赖拉入——node/db/python 组用不到它，
        # 一并置 n 防止 samba4 在这三组重复编译(单组白烧 30~60 分钟)。
        case "$GROUP_KEY" in
          db-pg)   TRIM='node|python3|sing-box|zerotier|nginx|nginx-full|uwsgi|miniupnpd|homeproxy|mariadb|redis|luci-app-samba4' ;;
          db-misc) TRIM='node|python3|sing-box|zerotier|nginx|nginx-full|uwsgi|miniupnpd|homeproxy|pgsql|luci-app-samba4' ;;
          node)    TRIM='pgsql|mariadb|redis|python3|sing-box|zerotier|nginx|nginx-full|uwsgi|miniupnpd|homeproxy|luci-app-samba4' ;;
          python)  TRIM='pgsql|mariadb|redis|node|sing-box|zerotier|nginx|nginx-full|uwsgi|miniupnpd|homeproxy|luci-app-samba4' ;;
          net)     TRIM='pgsql|mariadb|redis|node|python3|homeproxy|luci-app-|luci-theme-|luci-i18n-' ;;
          apps)    TRIM='pgsql|mariadb|redis|node|python3|sing-box|zerotier|nginx|nginx-full|uwsgi|miniupnpd' ;;
          *) echo "Error: unknown matrix group: $GROUP_KEY" >&2; exit 1 ;;
        esac
        echo "TRIM_PATTERN=$TRIM" >> "$GITHUB_ENV"
        echo "GROUP_CCACHE_KEY=${CCACHE_GROUP_BASE}${GROUP_KEY}-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
        echo "GROUP_CCACHE_RESTORE=${CCACHE_GROUP_BASE}${GROUP_KEY}-" >> "$GITHUB_ENV"

    - name: Cache Staging Directory(恢复工具链)
      uses: actions/cache@v4
      with:
        key: ${{ needs.Prepare.outputs.staging_key }}
        path: ${{ env.OPENWRT_PATH }}/staging_dir

    - name: Cache Core Tree(恢复build_dir与dl)
      uses: actions/cache@v4
      with:
        key: ${{ needs.Prepare.outputs.coretree_key }}
        path: |
          ${{ env.OPENWRT_PATH }}/build_dir
          ${{ env.OPENWRT_PATH }}/dl

    - name: Cache Group Ccache(恢复并上传分组ccache)
      uses: actions/cache@v4
      with:
        key: ${{ env.GROUP_CCACHE_KEY }}
        restore-keys: |
          ${{ env.GROUP_CCACHE_RESTORE }}
          ${{ needs.Prepare.outputs.ccache_key }}
        path: ${{ env.OPENWRT_PATH }}/.ccache

    - name: Update Feeds(更新feeds)
      run: |
        cd "$OPENWRT_PATH"
        ./scripts/feeds update -a

    - name: Load Custom Configuration(加载自定义配置)
      env:
        CONFIG_FILE: ${{ inputs.config_file }}
      run: |
        chmod +x "$GITHUB_WORKSPACE/$DIY_SCRIPT"
        cd "$OPENWRT_PATH"
        "$GITHUB_WORKSPACE/$DIY_SCRIPT" \
          "$GITHUB_WORKSPACE/$CONFIG_FILE" \
          "$GITHUB_WORKSPACE/$GENERAL_CONFIG_FILE"

    - name: Build Package Group(编译分组包)
      env:
        CONFIG_FILE: ${{ inputs.config_file }}
        GROUP_KEY: ${{ matrix.group }}
      run: |
        cat "$GITHUB_WORKSPACE/$CONFIG_FILE" "$GITHUB_WORKSPACE/$GENERAL_CONFIG_FILE" > "$OPENWRT_PATH/.config"
        cd "$OPENWRT_PATH"
        if [ "${{ inputs.remove_sqm_scripts_nss }}" = "true" ]; then
          sed -i '/CONFIG_PACKAGE_sqm-scripts-nss=y/d' .config
        fi
        # 把其他分组的重包符号置 n（依赖由 defconfig 自动补齐）
        awk -v pats="$TRIM_PATTERN" '
          /^CONFIG_PACKAGE_/ && /=y$/ {
            name = $0
            sub(/^CONFIG_PACKAGE_/, "", name)
            sub(/=.*/, "", name)
            if (name ~ "^(" pats ")") sub(/=y$/, "=n")
          }
          { print }
        ' .config > .config.trimmed
        mv .config.trimmed .config
        make defconfig
        if [ -d staging_dir ]; then
          tools_stamp="$(find staging_dir/host -maxdepth 2 -type f -name '.tools_compile*' -print -quit 2>/dev/null || true)"
          if [ -n "$tools_stamp" ]; then
            find staging_dir/host/stamp -maxdepth 1 -type f ! -name '.tools_compile*' -exec touch {} + 2>/dev/null || true
            find staging_dir/host -maxdepth 2 -type f -name '.tools_compile*' -exec touch {} +
          fi
          for toolchain_dir in staging_dir/toolchain-*; do
            [ -d "$toolchain_dir" ] || continue
            toolchain_stamp="$(find "$toolchain_dir" -maxdepth 2 -type f -name '.toolchain_compile*' -print -quit)"
            [ -n "$toolchain_stamp" ] || continue
            if [ -d "$toolchain_dir/stamp" ]; then
              find "$toolchain_dir/stamp" -maxdepth 1 -type f ! -name '.toolchain_compile*' -exec touch {} +
            fi
            find "$toolchain_dir" -maxdepth 2 -type f -name '.toolchain_compile*' -exec touch {} +
          done
        fi
        for attempt in 1 2 3; do
          if make download -j"$(nproc)"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "Error: make download failed after $attempt attempts" >&2
            exit 1
          fi
          echo "::warning::make download failed (attempt $attempt/3); removing incomplete files before retry."
          find dl -type f -size -1024c -print -delete
          sleep $((attempt * 5))
        done
        echo "Group $GROUP_KEY compiling; trim pattern: $TRIM_PATTERN"
        ccache -M 800M
        make -j"$(nproc)" || make -j1 V=s

  # ── 阶段 3：汇总组装 ────────────────────────────────────────────────
  # 完整配置；所有包编译命中各分组 ccache，主要剩链接、staging 安装与 rootfs 组装。
  Assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    needs:
      - Prepare
      - Build-Packages
    permissions:
      contents: read
      actions: read
    concurrency:
      group: openwrt-assemble-${{ inputs.artifact_prefix }}-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      artifact_name: ${{ needs.Prepare.outputs.artifact_name }}

    steps:
    - name: Initialization Environment(初始化环境)
      env:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_SUSPEND: 1
      run: |
        for attempt in 1 2 3; do
          if timeout -k 60 900 sudo -E apt-get -y update; then break; fi
          if [ "$attempt" -eq 3 ]; then echo "Error: apt-get update failed after 3 attempts" >&2; exit 1; fi
          echo "::warning::apt-get update failed (attempt $attempt/3); retrying."
          sleep $((attempt * 5))
        done
        for attempt in 1 2 3; do
          # asciidoc(texlive 全家桶数百MB)、antlr3(openjdk 数百MB)、uglifyjs(nodejs)
          # 是 apt 断流重排的最大拖累（run 42247191534 即死在这三条链上），仓库无脚本引用，删除。
          if timeout -k 60 1800 sudo -E apt-get -y install ack autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool jq libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libfuse-dev libssl-dev libtool lrzsz \
            genisoimage msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev qemu-utils \
            rsync scons squashfs-tools subversion swig texinfo upx-ucl unzip vim wget xmlto xxd zlib1g-dev; then break; fi
          if [ "$attempt" -eq 3 ]; then echo "Error: apt-get install failed after 3 attempts" >&2; exit 1; fi
          echo "::warning::apt-get install failed (attempt $attempt/3); fixing and retrying."
          sudo -E apt-get -y -f install || true
          sleep $((attempt * 5))
        done
        timeout -k 10 120 sudo -E systemctl daemon-reload || echo "::warning::daemon-reload timed out; continuing."
        timeout -k 10 120 sudo timedatectl set-timezone "$TZ" || echo "::warning::set-timezone timed out; continuing."

    - name: Checkout(检出代码)
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Clone Source Code(克隆源代码)
      env:
        REPO_URL: ${{ inputs.repo_url }}
        REPO_BRANCH: ${{ inputs.repo_branch }}
      run: |
        sudo mkdir -p "$OPENWRT_PATH"
        sudo chown -R "$(id -u):$(id -g)" "$OPENWRT_PATH"
        for attempt in 1 2 3; do
          if git clone --depth 1 -b "$REPO_BRANCH" --single-branch "$REPO_URL" "$OPENWRT_PATH"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "Error: source clone failed after $attempt attempts" >&2
            exit 1
          fi
          echo "::warning::Source clone failed (attempt $attempt/3); retrying."
          sudo rm -rf "$OPENWRT_PATH"
          sudo mkdir -p "$OPENWRT_PATH"
          sudo chown -R "$(id -u):$(id -g)" "$OPENWRT_PATH"
          sleep $((attempt * 5))
        done

    - name: Disable Mainland Mirrors(屏蔽大陆下载源)
      run: |
        cd "$OPENWRT_PATH"
        mirror_file="scripts/projectsmirrors.json"
        jq '
          with_entries(
            .value |= map(select(
              test("^https?://(mirrors\\.tencent\\.com|mirrors\\.aliyun\\.com|mirrors\\.tuna\\.tsinghua\\.edu\\.cn|mirrors\\.ustc\\.edu\\.cn|mirror\\.iscas\\.ac\\.cn|mirror\\.nju\\.edu\\.cn)(/|$)")
              | not
            ))
          )
        ' "$mirror_file" > "$mirror_file.tmp"
        mv "$mirror_file.tmp" "$mirror_file"
        sed -i '/raw\.gitmirror\.com/d' scripts/download.pl

    - name: Cache Staging Directory(恢复工具链)
      uses: actions/cache@v4
      with:
        key: ${{ needs.Prepare.outputs.staging_key }}
        path: ${{ env.OPENWRT_PATH }}/staging_dir

    - name: Cache Core Tree(恢复build_dir与dl)
      uses: actions/cache@v4
      with:
        key: ${{ needs.Prepare.outputs.coretree_key }}
        path: |
          ${{ env.OPENWRT_PATH }}/build_dir
          ${{ env.OPENWRT_PATH }}/dl

    - name: Cache Assembled Ccache(跨分组ccache聚合)
      uses: actions/cache@v4
      with:
        key: ${{ needs.Prepare.outputs.ccache_key }}-assemble-${{ github.run_id }}
        restore-keys: |
          ${{ needs.Prepare.outputs.ccache_key }}-assemble-
          ${{ needs.Prepare.outputs.ccache_group_base }}db-pg-
          ${{ needs.Prepare.outputs.ccache_group_base }}db-misc-
          ${{ needs.Prepare.outputs.ccache_group_base }}node-
          ${{ needs.Prepare.outputs.ccache_group_base }}python-
          ${{ needs.Prepare.outputs.ccache_group_base }}net-
          ${{ needs.Prepare.outputs.ccache_group_base }}apps-
          ${{ needs.Prepare.outputs.ccache_key }}
        path: ${{ env.OPENWRT_PATH }}/.ccache

    - name: Update Feeds(更新feeds)
      run: |
        cd "$OPENWRT_PATH"
        ./scripts/feeds update -a

    - name: Load Custom Configuration(加载自定义配置)
      env:
        CONFIG_FILE: ${{ inputs.config_file }}
      run: |
        chmod +x "$GITHUB_WORKSPACE/$DIY_SCRIPT"
        cd "$OPENWRT_PATH"
        "$GITHUB_WORKSPACE/$DIY_SCRIPT" \
          "$GITHUB_WORKSPACE/$CONFIG_FILE" \
          "$GITHUB_WORKSPACE/$GENERAL_CONFIG_FILE"

    - name: Assemble Firmware(组装完整固件)
      env:
        CONFIG_FILE: ${{ inputs.config_file }}
      run: |
        cat "$GITHUB_WORKSPACE/$CONFIG_FILE" "$GITHUB_WORKSPACE/$GENERAL_CONFIG_FILE" > "$OPENWRT_PATH/.config"
        cd "$OPENWRT_PATH"
        if [ "${{ inputs.remove_sqm_scripts_nss }}" = "true" ]; then
          sed -i '/CONFIG_PACKAGE_sqm-scripts-nss=y/d' .config
        fi
        make defconfig
        if [ -d staging_dir ]; then
          tools_stamp="$(find staging_dir/host -maxdepth 2 -type f -name '.tools_compile*' -print -quit 2>/dev/null || true)"
          if [ -n "$tools_stamp" ]; then
            find staging_dir/host/stamp -maxdepth 1 -type f ! -name '.tools_compile*' -exec touch {} + 2>/dev/null || true
            find staging_dir/host -maxdepth 2 -type f -name '.tools_compile*' -exec touch {} +
          fi
          for toolchain_dir in staging_dir/toolchain-*; do
            [ -d "$toolchain_dir" ] || continue
            toolchain_stamp="$(find "$toolchain_dir" -maxdepth 2 -type f -name '.toolchain_compile*' -print -quit)"
            [ -n "$toolchain_stamp" ] || continue
            if [ -d "$toolchain_dir/stamp" ]; then
              find "$toolchain_dir/stamp" -maxdepth 1 -type f ! -name '.toolchain_compile*' -exec touch {} +
            fi
            find "$toolchain_dir" -maxdepth 2 -type f -name '.toolchain_compile*' -exec touch {} +
          done
        fi
        for attempt in 1 2 3; do
          if make download -j"$(nproc)"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "Error: make download failed after $attempt attempts" >&2
            exit 1
          fi
          echo "::warning::make download failed (attempt $attempt/3); removing incomplete files before retry."
          find dl -type f -size -1024c -print -delete
          sleep $((attempt * 5))
        done
        ccache -M 2G
        make -j"$(nproc)" || make -j1 V=s

    - name: Check Space Usage(检查空间使用情况)
      if: (!cancelled())
      run: df -hT

    - name: Organize Files(整理文件)
      id: organize
      env:
        ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
        MANIFEST_FILE: ${{ inputs.manifest_file }}
        PACKAGE_EXTENSION: ${{ inputs.package_extension }}
      run: |
        cd "$OPENWRT_PATH"/bin/targets/*/*
        cp "$OPENWRT_PATH/.config" "$ARTIFACT_PREFIX.config"
        mv config.buildinfo "$ARTIFACT_PREFIX.config.buildinfo"
        mv "$MANIFEST_FILE" "$ARTIFACT_PREFIX.manifest"
        case "$PACKAGE_EXTENSION" in
          apk | ipk) ;;
          *)
            echo "Error: unsupported package extension: $PACKAGE_EXTENSION (expected apk or ipk)" >&2
            exit 1
            ;;
        esac
        mkdir -p packages
        package_count=0
        while IFS= read -r -d '' package_file; do
          mv -f "$package_file" packages/
          package_count=$((package_count + 1))
        done < <(find "$OPENWRT_PATH/bin/packages" -type f -name "*.$PACKAGE_EXTENSION" -print0)
        if [ "$package_count" -eq 0 ]; then
          echo "Error: no .$PACKAGE_EXTENSION package files found under $OPENWRT_PATH/bin/packages" >&2
          exit 1
        fi
        tar -zcf "$ARTIFACT_PREFIX.Packages.tar.gz" packages
        if [ "${{ inputs.rename_qualcommax_to_nowifi }}" = "true" ]; then
          for file in *qualcommax*.bin; do
            [ -e "$file" ] || continue
            mv "$file" "${file//qualcommax/nowifi}"
          done
        fi
        third_party_sources="$OPENWRT_PATH/third-party-sources.txt"
        if [ ! -s "$third_party_sources" ]; then
          echo "Error: third-party source revision file was not generated: $third_party_sources" >&2
          exit 1
        fi
        cp "$third_party_sources" "$ARTIFACT_PREFIX.third-party-sources.txt"
        rm -rf packages feeds.buildinfo version.buildinfo sha256sums profiles.json
        echo "firmware_path=$PWD" >> "$GITHUB_OUTPUT"

    - name: Upload Firmware Artifact(上传固件产物)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ needs.Prepare.outputs.artifact_name }}
        path: ${{ steps.organize.outputs.firmware_path }}/*
        if-no-files-found: error
        compression-level: 0
        overwrite: true
        retention-days: 3

  Release:
    runs-on: ubuntu-24.04
    needs:
      - Prepare
      - Assemble
    permissions:
      contents: write
      actions: read
    concurrency:
      group: openwrt-release-${{ github.repository }}-${{ inputs.artifact_prefix }}
      cancel-in-progress: false

    steps:
    - name: Compute Release Tag(计算版本化标签)
      id: rel_tag
      run: echo "tag=${{ inputs.firmware_tag }}-$(date +%Y.%m)" >> "$GITHUB_OUTPUT"

    - name: Download Firmware Artifact(下载固件产物)
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.Assemble.outputs.artifact_name }}
        path: artifacts/firmware

    - name: Upload Firmware To Release(发布固件)
      uses: ncipollo/release-action@v1
      with:
        name: ${{ steps.rel_tag.outputs.tag }}
        allowUpdates: true
        replacesArtifacts: true
        artifactErrorsFailBuild: true
        tag: ${{ steps.rel_tag.outputs.tag }}
        token: ${{ github.token }}
        artifacts: artifacts/firmware/*
        body: |
          **This is OpenWrt Firmware for ${{ inputs.firmware_tag }}**
          ### 📒 固件信息
          - ${{ inputs.release_summary }}
          - 💻 这是 ${{ inputs.firmware_tag }} 平台使用的 OpenWrt 固件
          - ⚽ 固件源码: ${{ inputs.repo_url }}
          - 💝 源码分支: ${{ inputs.repo_branch }}
          - 🌐 默认地址: **192.168.2.1**
          - 🔑 默认密码: none
          ### 🧊 固件版本
          - 固件内核版本：**${{ needs.Prepare.outputs.version_kernel }}**
          - 固件编译前最后一次➦[主源码](${{ inputs.repo_url }})更新记录
          - ${{ needs.Prepare.outputs.version_info }}

  # ── 阶段 2.5：失败自动重触发整轮 ─────────────────────────────────────
  # rerun_failed_jobs 对含 reusable 调用的 run 不可用(404)，GITHUB_TOKEN 也不允许
  # 触发 workflow 事件，因此用 GH_PAT secret 走 workflow_dispatch 重开一轮：
  # 已成功分组靠 ccache/core-tree 缓存秒过，只有死过的组重新抽签。
  # 防循环：最近两轮已完成的运行均失败则停手等人工介入。
  Retry-Failed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - Prepare
      - Build-Packages
    # Prepare 失败时 Build-Packages 是 skipped，所以必须把 Prepare 也纳入触发条件
    # （run 42247191534：Prepare 失败、Retry-Failed 因只看 Build-Packages 被 skipped）。
    if: ${{ always() && (needs.Prepare.result == 'failure' || needs.Build-Packages.result == 'failure') }}
    permissions:
      actions: read
    steps:
    - name: Re-trigger Workflow(自动重触发整轮)
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}
        TOP_WORKFLOW: ${{ github.workflow }}
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "::warning::GH_PAT secret 未配置，跳过自动重试（可在 Actions 页手动重新运行）。"
          exit 0
        fi
        wf_path="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" -q ".workflows[] | select(.name==\"$TOP_WORKFLOW\") | .path")"
        if [ -z "$wf_path" ]; then
          echo "::warning::找不到顶层 workflow '$TOP_WORKFLOW' 的文件路径，跳过自动重试。"
          exit 0
        fi
        recent="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/${wf_path}/runs?per_page=5" -q '[.workflow_runs[] | select(.status=="completed") | .conclusion] | .[0:2]')"
        echo "最近两轮结论: $recent"
        if [ "$recent" = '["failure","failure"]' ]; then
          echo "::error::最近两轮均失败，停止自动重试，请人工介入。"
          exit 1
        fi
        echo "自动重触发 $wf_path ..."
        gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/workflows/${wf_path}/dispatches" -f ref="${GITHUB_REF}"

  # ── 通知：构建结束（成功或失败）推送 Gotify ──────────────────────────
  Notify:
    runs-on: ubuntu-24.04
    needs:
      - Build-Packages
      - Assemble
      - Release
    if: ${{ always() }}
    permissions:
      contents: read
      actions: read

    steps:
    - name: Send Gotify Notification(发送构建通知)
      env:
        GOTIFY_URL: http://hzer.cc/gotify
        GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
        RESULT_PACKAGES: ${{ needs.Build-Packages.result }}
        RESULT_ASSEMBLE: ${{ needs.Assemble.result }}
        RESULT_RELEASE: ${{ needs.Release.result }}
        FIRMWARE_TAG: ${{ inputs.firmware_tag }}
      run: |
        if [ -z "$GOTIFY_TOKEN" ]; then
          echo "GOTIFY_TOKEN secret 未设置，跳过通知。"
          exit 0
        fi
        tag="${FIRMWARE_TAG}-$(date +%Y.%m)"
        run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        if [ "$RESULT_ASSEMBLE" = "success" ] && [ "$RESULT_RELEASE" = "success" ]; then
          title="✅ 固件构建成功: ${tag}"
          message="矩阵编译完成，Release 已更新。详情: ${run_url}"
          priority=5
        else
          title="❌ 固件构建失败: ${tag}"
          message="分组=${RESULT_PACKAGES} 组装=${RESULT_ASSEMBLE} 发布=${RESULT_RELEASE} 详情: ${run_url}"
          priority=8
        fi
        payload="$(jq -n --arg title "$title" --arg message "$message" --argjson priority "$priority" \
          '{title: $title, message: $message, priority: $priority}')"
        curl -sf -X POST "${GOTIFY_URL}/message" \
          -H "X-Gotify-Key: ${GOTIFY_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "$payload" || echo "::warning::Gotify 通知发送失败。"

  Cleanup:
    runs-on: ubuntu-24.04
    needs:
      - Prepare
      - Build-Packages
      - Assemble
      - Release
    if: ${{ !cancelled() && needs.Assemble.result == 'success' && needs.Release.result == 'success' }}
    permissions:
      contents: read
      actions: write

    steps:
    - name: Delete Old Cache(删除旧缓存)
      env:
        CCACHE_KEY: ${{ needs.Prepare.outputs.ccache_key }}
        STAGING_KEY: ${{ needs.Prepare.outputs.staging_key }}
        CORETREE_KEY: ${{ needs.Prepare.outputs.coretree_key }}
        CCACHE_GROUP_BASE: ${{ needs.Prepare.outputs.ccache_group_base }}
        GH_TOKEN: ${{ github.token }}
      run: |
        delete_old_cache_versions() {
          local cache_id
          local cache_key
          local cache_list_file
          local current_key="$1"
          local current_created_at
          local key_prefix="${current_key%-*}"
          key_prefix="${key_prefix%-*}-"

          cache_list_file="$(mktemp "$RUNNER_TEMP/openwrt-cache-list.XXXXXX.json")"
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$key_prefix" --limit 10000 --sort created_at --order desc --json id,key,createdAt > "$cache_list_file"
          current_created_at="$(jq -r --arg key "$current_key" '[.[] | select(.key == $key) | .createdAt] | first // empty' "$cache_list_file")"
          if [ -z "$current_created_at" ]; then
            echo "::warning::Current cache was not found; skip cleanup for $current_key."
            rm -f "$cache_list_file"
            return 0
          fi

          jq -r --arg key "$current_key" --arg created_at "$current_created_at" \
            '.[] | select(.key != $key and .createdAt < $created_at) | [.id, .key] | @tsv' "$cache_list_file" |
            while IFS=$'\t' read -r cache_id cache_key; do
              [ -n "$cache_id" ] || continue
              gh cache delete --repo "$GITHUB_REPOSITORY" "$cache_id" || echo "::warning::Unable to delete cache $cache_key ($cache_id)."
            done
          rm -f "$cache_list_file"
        }

        delete_old_cache_versions "$CCACHE_KEY"
        delete_old_cache_versions "$STAGING_KEY"
        delete_old_cache_versions "$CORETREE_KEY"
        for group in db-pg db-misc node python net apps; do
          delete_old_cache_versions "${CCACHE_GROUP_BASE}${group}-${GITHUB_RUN_ID}"
        done

    - name: Delete Old Workflows(删除旧工作流)
      if: ${{ inputs.delete_old_workflows }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cutoff="$(date -u -d '2 days ago' +'%Y-%m-%dT%H:%M:%SZ')"
        run_ids_file="$RUNNER_TEMP/old-workflow-run-ids.txt"
        gh api --method GET --paginate "/repos/$GITHUB_REPOSITORY/actions/runs" \
          -f status=completed \
          -f "created=<$cutoff" \
          -F per_page=100 \
          --jq '.workflow_runs[].id' > "$run_ids_file"
        while read -r run_id; do
          [ -n "$run_id" ] || continue
          gh run delete --repo "$GITHUB_REPOSITORY" "$run_id" || echo "::warning::Unable to delete workflow run $run_id."
        done < "$run_ids_file"
